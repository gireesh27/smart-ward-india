name: Build and deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  images:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: App image (arm64 for Oracle Ampere, amd64 for Azure/AWS)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          platforms: linux/arm64,linux/amd64
          tags: ghcr.io/${{ github.repository }}:latest,ghcr.io/${{ github.repository }}:${{ github.sha }}
      - name: Tools image (LGD import, migrations)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: tools
          push: true
          platforms: linux/arm64,linux/amd64
          tags: ghcr.io/${{ github.repository }}:latest-tools
  deploy:
    needs: images
    if: ${{ vars.DEPLOY_HOST != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER || 'ubuntu' }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/smartward
            git pull --ff-only
            docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.production pull app
            docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.production up -d app
